<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1万天倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .description {
            font-size: 1.2rem;
            margin-bottom: 40px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .countdown {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .time-unit {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-width: 130px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .time-unit:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .time-value {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }
        
        .time-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
        }
        
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin: 30px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            border-radius: 10px;
            width: 0%;
            transition: width 1s ease;
        }
        
        .dates {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 1.1rem;
        }
        
        .start-date, .end-date {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        .message {
            margin-top: 30px;
            font-size: 1.4rem;
            font-weight: 300;
            line-height: 1.6;
        }
        
        .highlight {
            color: #ffcc00;
            font-weight: 700;
        }
        
        .firework {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }
        
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 6px currentColor;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .time-unit {
                min-width: 100px;
                padding: 15px;
            }
            
            .time-value {
                font-size: 2.8rem;
            }
            
            .container {
                padding: 25px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .time-unit {
                min-width: 70px;
                padding: 10px;
            }
            
            .time-value {
                font-size: 2rem;
            }
            
            .time-label {
                font-size: 0.9rem;
            }
            
            .description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>距离1万天后的世界</h1>
        
        <p class="description">
            从 <span class="highlight">2025年8月1日 00:00 UTC</span> 开始，我们正在倒计时前往<span class="highlight">1万天后</span>的未来世界。
            每一天都是迈向未来的脚步，每一秒都充满无限可能。
        </p>
        
        <div class="countdown">
            <div class="time-unit">
                <div class="time-value" id="days">0</div>
                <div class="time-label">天</div>
            </div>
            
            <div class="time-unit">
                <div class="time-value" id="hours">0</div>
                <div class="time-label">时</div>
            </div>
            
            <div class="time-unit">
                <div class="time-value" id="minutes">0</div>
                <div class="time-label">分</div>
            </div>
            
            <div class="time-unit">
                <div class="time-value" id="seconds">0</div>
                <div class="time-label">秒</div>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="dates">
            <div class="start-date">开始日期: 2025-08-01 00:00 UTC</div>
            <div class="end-date">目标日期: <span id="end-date">2053-02-15</span></div>
        </div>
        
        <div class="message">
            <p>每一天都是新的旅程，每一刻都值得珍惜。</p>
            <p>让我们共同期待<span class="highlight">1万天后</span>的世界！</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 设置起始时间和目标时间（UTC）
            const startDate = new Date(Date.UTC(2025, 7, 1, 0, 0, 0, 0)); // 2025年8月1日 00:00 UTC
            const totalDays = 10000;
            const endDate = new Date(startDate);
            endDate.setUTCDate(startDate.getUTCDate() + totalDays);
            
            // 显示结束日期
            document.getElementById('end-date').textContent = endDate.toISOString().split('T')[0];
            
            // 更新倒计时函数
            function updateCountdown() {
                const now = new Date();
                const nowUTC = new Date(now.getTime() + (now.getTimezoneOffset() * 60000));
                
                // 计算时间差（秒）
                let diff = Math.floor((endDate - nowUTC) / 1000);
                
                // 如果已经到达或超过目标日期
                if (diff <= 0) {
                    document.getElementById('days').textContent = '0';
                    document.getElementById('hours').textContent = '0';
                    document.getElementById('minutes').textContent = '0';
                    document.getElementById('seconds').textContent = '0';
                    document.getElementById('progress-bar').style.width = '100%';
                    return;
                }
                
                // 计算天、时、分、秒
                const days = Math.floor(diff / (24 * 60 * 60));
                diff -= days * 24 * 60 * 60;
                
                const hours = Math.floor(diff / (60 * 60));
                diff -= hours * 60 * 60;
                
                const minutes = Math.floor(diff / 60);
                diff -= minutes * 60;
                
                const seconds = diff;
                
                // 更新显示
                document.getElementById('days').textContent = days;
                document.getElementById('hours').textContent = hours;
                document.getElementById('minutes').textContent = minutes;
                document.getElementById('seconds').textContent = seconds;
                
                // 更新进度条
                const totalSeconds = totalDays * 24 * 60 * 60;
                const elapsedSeconds = totalSeconds - diff - days * 24 * 60 * 60;
                const progress = ((days * 24 * 60 * 60 + elapsedSeconds) / totalSeconds) * 100;
                document.getElementById('progress-bar').style.width = progress + '%';
            }
            
            // 初始化并开始倒计时
            updateCountdown();
            setInterval(updateCountdown, 1000);
        });

        // 礼花效果
        document.addEventListener('click', function(e) {
            createFirework(e.clientX, e.clientY);
        });

        function createFirework(x, y) {
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.left = x + 'px';
            firework.style.top = y + 'px';
            document.body.appendChild(firework);

            const particleCount = 30 + Math.floor(Math.random() * 20); // 减少数量，增大尺寸
            const colors = ['#ff0000', '#ffff00', '#00ff00', '#00ffff', '#ff00ff', '#ffffff', '#ff8800', '#0088ff'];
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = 8 + Math.random() * 12; // 更大的尺寸：8-20px
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 7; // 增加速度
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                const gravity = 0.08; // 增加重力效果
                const friction = 0.98;
                
                let posX = 0;
                let posY = 0;
                let currentVY = vy;
                
                firework.appendChild(particle);
                
                // 动画函数
                function animate() {
                    posX += vx;
                    posY += currentVY;
                    currentVY += gravity;
                    currentVY *= friction;
                    
                    particle.style.transform = `translate(${posX}px, ${posY}px)`;
                    particle.style.opacity = Math.max(0, 1 - (Date.now() - startTime) / 1500); // 延长显示时间
                    
                    if (particle.style.opacity > 0.1) {
                        requestAnimationFrame(animate);
                    } else {
                        particle.remove();
                        if (firework.children.length === 0) {
                            firework.remove();
                        }
                    }
                }
                
                const startTime = Date.now();
                setTimeout(() => {
                    requestAnimationFrame(animate);
                }, Math.random() * 50);
            }
        }
    </script>
</body>
</html>
