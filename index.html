<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1万天倒计时</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .description {
            font-size: 1.2rem;
            margin-bottom: 40px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .future-letter {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin: 30px 0;
        }
        .future-letter h3 {
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        .letter-input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1rem;
            margin: 10px 0;
        }
        .letter-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        .letter-display {
            margin-top: 15px;
            font-style: italic;
            min-height: 24px;
        }
        .btn {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover {
            opacity: 0.9;
        }

        .daily-question {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin: 30px 0;
        }
        .daily-question h3 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        .question-text {
            font-size: 1.1rem;
            margin: 10px 0;
            min-height: 28px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .time-unit {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            min-width: 130px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .time-unit:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .time-value {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
        }
        
        .time-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
        }
        
        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin: 30px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
            border-radius: 10px;
            width: 0%;
            transition: width 1s ease;
        }
        
        .dates {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 1.1rem;
        }
        
        .start-date, .end-date {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        .message {
            margin-top: 30px;
            font-size: 1.4rem;
            font-weight: 300;
            line-height: 1.6;
        }
        
        .highlight {
            color: #ffcc00;
            font-weight: 700;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }
            .time-unit {
                min-width: 100px;
                padding: 15px;
            }
            .time-value {
                font-size: 2.8rem;
            }
            .container {
                padding: 25px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            .time-unit {
                min-width: 70px;
                padding: 10px;
            }
            .time-value {
                font-size: 2rem;
            }
            .time-label {
                font-size: 0.9rem;
            }
            .description {
                font-size: 1rem;
            }
            .future-letter, .daily-question {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>距离1万天后的世界</h1>
        
        <p class="description">
            从 <span class="highlight">2025年8月1日 00:00 UTC</span> 开始，我们正在倒计时前往<span class="highlight">1万天后</span>的未来世界。
            每一天都是迈向未来的脚步，每一秒都充满无限可能。
        </p>

        <div class="future-letter">
            <h3>✨ 写给2053年的你</h3>
            <textarea id="letter-input" class="letter-input" rows="3" placeholder="写下你想对1万天后的自己说的话..."></textarea>
            <br>
            <button class="btn" onclick="saveLetter()">保存留言</button>
            <div id="letter-display" class="letter-display"></div>
        </div>

        <div class="daily-question">
            <h3>🤔 今日思考</h3>
            <div id="question-text" class="question-text">加载中...</div>
            <button class="btn" onclick="showNewQuestion()">换一个问题</button>
        </div>
        
        <div class="countdown">
            <div class="time-unit">
                <div class="time-value" id="days">0</div>
                <div class="time-label">天</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="hours">0</div>
                <div class="time-label">时</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="minutes">0</div>
                <div class="time-label">分</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="seconds">0</div>
                <div class="time-label">秒</div>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="dates">
            <div class="start-date">开始日期: 2025-08-01 00:00 UTC</div>
            <div class="end-date">目标日期: <span id="end-date">2053-02-15</span></div>
        </div>
        
        <div class="message">
            <p>每一天都是新的旅程，每一刻都值得珍惜。</p>
            <p>让我们共同期待<span class="highlight">1万天后</span>的世界！</p>
        </div>
    </div>

    <script>
        // 趣味问题库
        const questions = [
            "1万天后，你会在哪里？",
            "如果能给未来的自己带一件东西，你会选什么？",
            "你希望2053年的世界是什么样子？",
            "现在的你，最想感谢谁？",
            "如果时间是一条河，你希望它流向何方？",
            "1万天后，你希望自己学会了什么新技能？",
            "你相信未来的自己会为今天的选择骄傲吗？"
        ];

        function showNewQuestion() {
            const randomQ = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('question-text').textContent = randomQ;
        }

        function saveLetter() {
            const input = document.getElementById('letter-input');
            const text = input.value.trim();
            if (text) {
                localStorage.setItem('futureLetter', text);
                displayLetter();
                input.value = '';
                alert('留言已保存！✨');
            }
        }

        function displayLetter() {
            const saved = localStorage.getItem('futureLetter');
            const display = document.getElementById('letter-display');
            if (saved) {
                display.textContent = `"${saved}"`;
            } else {
                display.textContent = "还没有留言哦，快写下给未来的寄语吧！";
            }
        }

        // 倒计时主逻辑
        document.addEventListener('DOMContentLoaded', function() {
            // 起始时间：2025年8月1日 00:00 UTC
            const startDate = new Date(Date.UTC(2025, 7, 1, 0, 0, 0, 0));
            const totalDays = 10000;
            const endDate = new Date(startDate);
            endDate.setDate(startDate.getUTCDate() + totalDays);
            
            // 显示目标日期（本地格式 YYYY-MM-DD）
            document.getElementById('end-date').textContent = endDate.toISOString().split('T')[0];

            function updateCountdown() {
                const now = new Date();
                // 转为 UTC 时间进行比较（避免时区干扰）
                const nowUTC = new Date(now.getTime() + now.getTimezoneOffset() * 60000);
                const totalDiffMs = endDate - nowUTC;

                if (totalDiffMs <= 0) {
                    // 已到达目标
                    document.getElementById('days').textContent = '0';
                    document.getElementById('hours').textContent = '0';
                    document.getElementById('minutes').textContent = '0';
                    document.getElementById('seconds').textContent = '0';
                    document.getElementById('progress-bar').style.width = '100%';
                    return;
                }

                // 转换为总秒数（向下取整）
                const totalSec = Math.floor(totalDiffMs / 1000);

                // 分解时间单位（使用取模确保范围正确）
                const days = Math.floor(totalSec / 86400);
                const hours = Math.floor((totalSec % 86400) / 3600);
                const minutes = Math.floor((totalSec % 3600) / 60);
                const seconds = totalSec % 60; // ✅ 保证 0~59

                // 更新显示
                document.getElementById('days').textContent = days;
                document.getElementById('hours').textContent = hours;
                document.getElementById('minutes').textContent = minutes;
                document.getElementById('seconds').textContent = seconds;

                // 更新进度条
                const totalSeconds = totalDays * 86400; // 10000天的总秒数
                const elapsedSeconds = totalSeconds - totalSec;
                const progress = (elapsedSeconds / totalSeconds) * 100;
                document.getElementById('progress-bar').style.width = progress + '%';
            }

            // 初始化并启动倒计时
            updateCountdown();
            setInterval(updateCountdown, 1000);

            // 初始化互动内容
            showNewQuestion();
            displayLetter();
        });
    </script>
</body>
</html>
